name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.15.0)'
        required: true
        default: 'v0.15.0'
      android:
        description: 'Build the Android APK'
        type: boolean
        default: true
      ios:
        description: 'Build the unsigned iOS IPA'
        type: boolean
        default: true
      macos:
        description: 'Build the macOS app'
        type: boolean
        default: true
      pwa:
        description: 'Build the installable web app'
        type: boolean
        default: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.1'
  RELEASE_NOTES: |
    Aurora Music — personal build.

    | Platform | File | Notes |
    | --- | --- | --- |
    | Android | `*.apk` | Enable "install unknown apps", then open it |
    | iOS | `*.ipa` | Unsigned: re-sign with AltStore / SideStore / Sideloadly |
    | macOS | `*.zip` | Unzip, right-click → Open the first time |
    | Web | `pwa.zip` | Static build: serve over HTTPS, then install |

    Everything runs on the device. No server, no account required.

jobs:
  android:
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Release signing key
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key in secrets; the build will use the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > aurora-release.jks
          cat > key.properties <<EOF
          storeFile=aurora-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64
          --dart-define-from-file=google-public.json
          --dart-define=APP_VERSION=${{ inputs.tag || github.ref_name }}

      - name: Rename
        working-directory: mobile
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/aurora-music-${TAG}-arm64.apk"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Attach
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Aurora Music ${{ inputs.tag || github.ref_name }}
          body: ${{ env.RELEASE_NOTES }}
          files: mobile/out/*.apk
          fail_on_unmatched_files: true

  ios:
    if: github.event_name == 'push' || inputs.ios
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign
          --dart-define-from-file=google-public.json
          --dart-define=APP_VERSION=${{ inputs.tag || github.ref_name }}

      - name: Package unsigned IPA
        run: |
          mkdir -p out Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "out/aurora-music-${TAG}-unsigned.ipa" Payload
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Attach
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Aurora Music ${{ inputs.tag || github.ref_name }}
          body: ${{ env.RELEASE_NOTES }}
          files: mobile/out/*.ipa
          fail_on_unmatched_files: true

  macos:
    if: github.event_name == 'push' || inputs.macos
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release
          --dart-define-from-file=google-public.json
          --dart-define=APP_VERSION=${{ inputs.tag || github.ref_name }}

      - name: Zip app
        run: |
          mkdir -p out
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent aurora_music.app \
            "../../../../../out/aurora-music-${TAG}-macos.zip"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Attach
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Aurora Music ${{ inputs.tag || github.ref_name }}
          body: ${{ env.RELEASE_NOTES }}
          files: mobile/out/*.zip
          fail_on_unmatched_files: true

  pwa:
    if: github.event_name == 'push' || inputs.pwa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci || npm install
      - run: npm run build

      - name: Package static build
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p out
          cp -R .output/public/. out/
          cat > out/DEPLOY.txt <<'TXT'
          Aurora Music — installable web app.

          Serve this folder over HTTPS, then install:
            Android/Chrome: "Install" in the app, or browser menu
            iPhone/Safari:  Share → Add to Home Screen

          Local test: npx serve .
          The service worker only registers on https or localhost.
          TXT
          cd out && zip -qry "../aurora-music-pwa-${TAG}.zip" .

      - name: Attach
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Aurora Music ${{ inputs.tag || github.ref_name }}
          body: ${{ env.RELEASE_NOTES }}
          files: aurora-music-pwa-*.zip
          fail_on_unmatched_files: true
